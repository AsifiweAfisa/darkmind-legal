<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DarkMind Creator Platform</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #ffffff; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px; }
        h1 { color: #111; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; font-size: 14px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #000; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .links { margin-top: 20px; font-size: 12px; }
        .links a { color: #000; text-decoration: none; margin: 0 10px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>DarkMind Studio</h1>
        <p>Enterprise Video Assembly & Publishing<br><em>(Closed Beta Access Only)</em></p>
        <input type="text" placeholder="Username / Email">
        <input type="password" placeholder="Password">
        <button onclick="alert('Invalid test credentials or backend offline. Please use the desktop client.')">Log In to Dashboard</button>
        <div class="links">
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
        </div>
    </div>
</body>
</html>
